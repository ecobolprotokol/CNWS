[workspace]
resolver = "2"
members = [
    "cnws-core",
    "cnws-cli",
    "cnws-conformance",
]
exclude = [
    "fixtures",
    "benches",
    "tests",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/cnws/cnws"

[workspace.dependencies]
# Core dependencies
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
zstd = "0.13"
lz4 = "1.9"
crc32fast = "1.4"
hex = "0.4"
regex = "1.10"
walkdir = "2.4"
memmap2 = "0.9"
tempfile = "3.8"
fs2 = "0.4"
parking_lot = "0.12"
dashmap = "5.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
prometheus = "0.14"
axum = "0.7"
clap = { version = "4.4", features = ["derive"] }
safetensors = "0.4"
half = "2.4"
bytemuck = { version = "1.14", features = ["derive"] }
byteorder = "1.5"
criterion = "0.5"
proptest = "1.4"
